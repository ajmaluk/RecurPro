<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brightloop Real-Screen Walkthrough Video Recorder</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #status {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #0ea5e9;
      letter-spacing: 0.05em;
    }
    #progress {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    canvas {
      width: 960px;
      height: 540px;
      border: 1px solid #1f293d;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background: #090d16;
    }
  </style>
</head>
<body>
  <div id="status">LOADING SCREEN ASSETS...</div>
  <div id="progress">Preloading actual application screenshots...</div>
  <canvas id="recCanvas" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById("recCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");

    // Audio setup
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const audioDest = audioCtx.createMediaStreamDestination();

    function playTone(freq, duration, type = "sine", gainVal = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioDest);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playChord(baseFreq) {
      playTone(baseFreq, 1.2, "sine", 0.08);
      playTone(baseFreq * 1.25, 1.2, "sine", 0.06);
      playTone(baseFreq * 1.5, 1.2, "sine", 0.06);
    }

    function playClick() {
      playTone(600, 0.05, "triangle", 0.05);
    }

    function playSuccessChime() {
      playTone(523.25, 0.3, "sine", 0.1);
      setTimeout(() => playTone(659.25, 0.3, "sine", 0.1), 100);
      setTimeout(() => playTone(783.99, 0.5, "sine", 0.12), 200);
      setTimeout(() => playTone(1046.50, 0.8, "sine", 0.15), 300);
    }

    // Preload actual UI screenshots
    const SHOT_PATHS = {
      landing: "/shots/01_landing.png",
      login: "/shots/02_admin_login.png",
      dashboard: "/shots/03_dashboard.png",
      billing: "/shots/04_billing_runs.png",
      invoices: "/shots/05_invoices.png",
      share: "/shots/06_invoice_share.png",
      subs: "/shots/07_subscriptions.png",
      staff: "/shots/08_staff_customers.png",
      portal: "/shots/09_customer_portal.png",
      taxInvoice: "/shots/10_tax_invoice_public.png"
    };

    const images = {};

    async function preloadImages() {
      const keys = Object.keys(SHOT_PATHS);
      for (const k of keys) {
        const img = new Image();
        img.src = SHOT_PATHS[k];
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = () => {
            console.warn("Failed loading " + SHOT_PATHS[k]);
            res();
          };
        });
        images[k] = img;
      }
    }

    // Drawing Helpers
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    }

    function drawScreenFrame(img, crop, targetRect, zoom = 1, panX = 0, panY = 0) {
      const { x, y, w, h } = targetRect;
      
      // Outer drop shadow & frame container
      roundRect(ctx, x - 10, y - 40, w + 20, h + 50, 16, "#0f172a", "#1e293b");

      // Window bar
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(x - 10, y - 40, w + 20, 40);
      
      // Window dots
      const dotColors = ["#ef4444", "#f59e0b", "#10b981"];
      dotColors.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x + 10 + i * 16, y - 20, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Address bar simulation
      roundRect(ctx, x + 70, y - 32, w - 160, 24, 4, "#090d16", "#334155");
      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px monospace";
      ctx.textAlign = "left";
      ctx.fillText("https://brightloop.io/app", x + 85, y - 16);

      // Draw the actual running screenshot inside the clipping region
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      if (img && img.complete && img.naturalWidth > 0) {
        const sw = img.naturalWidth / zoom;
        const sh = img.naturalHeight / zoom;
        const sx = Math.max(0, Math.min(img.naturalWidth - sw, panX));
        const sy = Math.max(0, Math.min(img.naturalHeight - sh, panY));
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      } else {
        ctx.fillStyle = "#111827";
        ctx.fillRect(x, y, w, h);
      }
      ctx.restore();
    }

    function drawCursor(x, y, clicking = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = clicking ? "#38bdf8" : "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 18);
      ctx.lineTo(5, 14);
      ctx.lineTo(10, 22);
      ctx.lineTo(13, 20);
      ctx.lineTo(8, 12);
      ctx.lineTo(14, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (clicking) {
        ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHeader(chapterNum, title) {
      ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
      ctx.fillRect(0, 0, 1920, 85);
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 85);
      ctx.lineTo(1920, 85);
      ctx.stroke();

      // Brand Logo
      ctx.fillStyle = "#14b8a6";
      ctx.beginPath();
      ctx.arc(55, 42, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#070b14";
      ctx.beginPath();
      ctx.arc(55, 42, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Brightloop", 80, 50);

      // Chapter badge
      roundRect(ctx, 225, 26, 135, 32, 6, "rgba(14, 165, 233, 0.15)", "#0ea5e9");
      ctx.fillStyle = "#0ea5e9";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText(`SCENE 0${chapterNum} / 09`, 240, 47);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "500 18px sans-serif";
      ctx.fillText(`—  ${title}`, 380, 48);

      roundRect(ctx, 1680, 26, 180, 32, 16, "rgba(16, 185, 129, 0.12)", "#10b981");
      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.arc(1700, 42, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("LIVE APP RECORDING", 1715, 47);
    }

    function drawCallout(x, y, title, desc, col = "#0ea5e9") {
      roundRect(ctx, x, y, 380, 100, 10, "rgba(15, 23, 42, 0.95)", col);
      roundRect(ctx, x + 15, y + 15, 6, 70, 3, col, null);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(title, x + 35, y + 38);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "13px sans-serif";
      ctx.fillText(desc, x + 35, y + 68);
    }

    function drawNarration(scriptText, progressPct) {
      roundRect(ctx, 80, 960, 1760, 80, 12, "rgba(15, 23, 42, 0.98)", "#1e293b");

      // Progress bar
      ctx.fillStyle = "rgba(30, 41, 59, 0.8)";
      ctx.fillRect(80, 1035, 1760, 5);
      ctx.fillStyle = "#0ea5e9";
      ctx.fillRect(80, 1035, 1760 * progressPct, 5);

      roundRect(ctx, 105, 978, 130, 26, 6, "rgba(14, 165, 233, 0.2)", "#0ea5e9");
      ctx.fillStyle = "#0ea5e9";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("🎙 VOICEOVER", 120, 995);

      ctx.fillStyle = "#ffffff";
      ctx.font = "500 19px sans-serif";
      ctx.fillText(scriptText, 255, 996);
    }

    // 9 SCENES INTEGRATING ACTUAL APPLICATION SCREEN RECORDINGS
    const SCENES = [
      {
        id: 1,
        title: "Platform Overview & Landing Experience",
        duration: 4.5,
        voice: "Welcome to Brightloop, modern recurring billing built on React 19, Express, and a relational MySQL datastore.",
        draw(t, p) {
          drawHeader(1, "Landing Page & High-Volume Architecture");
          
          // Actual landing page screenshot with subtle zoom
          const zoom = 1 + p * 0.08;
          drawScreenFrame(images.landing, null, { x: 80, y: 120, w: 1350, h: 810 }, zoom, p * 80, p * 40);

          // Real-time callout badges
          drawCallout(1460, 150, "Full-Stack Core Stack", "React 19 + TypeScript + Express + MySQL 8.0.", "#0ea5e9");
          drawCallout(1460, 280, "Zero-Downtime Fallback", "Operating with memory persistence fallback.", "#14b8a6");
          drawCallout(1460, 410, "GST 18% Compliant", "Automatic CGST & SGST calculations.", "#10b981");
          drawCallout(1460, 540, "Integrated Walkthrough", "Direct access to presentation & live demo.", "#8b5cf6");

          // Animated mouse cursor scrolling to CTA
          const curX = 500 + p * 300;
          const curY = 400 + Math.sin(p * 5) * 50;
          drawCursor(curX, curY);

          drawNarration(this.voice, p);
        }
      },
      {
        id: 2,
        title: "Admin & Staff Back Office Login",
        duration: 4.5,
        voice: "Administrators log in at admin/login using admin@brightloop.io, with dedicated role authentication.",
        draw(t, p) {
          drawHeader(2, "Secure Role-Based Back Office Authentication");

          drawScreenFrame(images.login, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.05, 100, 80);

          drawCallout(1460, 180, "Role-Based Access Control", "Admin, Staff, and Customer isolated portals.", "#0ea5e9");
          drawCallout(1460, 320, "Demo Credentials Included", "admin@brightloop.io / Password123!", "#10b981");
          drawCallout(1460, 460, "JWT Secure Sessions", "Stored under brightloop_token with auto-refresh.", "#f59e0b");

          // Cursor clicking the Sign In button
          const clickProgress = Math.min(1, Math.max(0, (p - 0.5) * 4));
          const cx = 720;
          const cy = 600;
          drawCursor(cx, cy, clickProgress > 0 && clickProgress < 0.8);

          drawNarration(this.voice, p);
        }
      },
      {
        id: 3,
        title: "Financial Operations Dashboard",
        duration: 4.5,
        voice: "Upon login, the executive dashboard displays real-time MRR, active subscriber counts, and cash flow trends.",
        draw(t, p) {
          drawHeader(3, "Real-Time Financial Dashboard & Metrics");

          drawScreenFrame(images.dashboard, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.04, p * 40, 20);

          drawCallout(1460, 160, "Monthly Recurring Revenue", "Tracks MRR growth with integer paise precision.", "#0ea5e9");
          drawCallout(1460, 300, "Active Subscribers", "Monitors total active plans & low churn rates.", "#10b981");
          drawCallout(1460, 440, "Recent Invoices Feed", "Live status updates: Draft, Posted, and Paid.", "#14b8a6");
          drawCallout(1460, 580, "Interactive Visualizations", "Custom CSS and SVG charts with zero lag.", "#8b5cf6");

          drawCursor(400 + p * 200, 350 + Math.cos(p * 4) * 30);
          drawNarration(this.voice, p);
        }
      },
      {
        id: 4,
        title: "Automated Billing Runs & Dunning Cycles",
        duration: 4.5,
        voice: "The deterministic billing engine automates invoicing without risk of duplicate runs, with automated dunning.",
        draw(t, p) {
          drawHeader(4, "Deterministic Billing Engine & Batch Invoicing");

          drawScreenFrame(images.billing, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.05, 50, 40);

          drawCallout(1460, 180, "Run Invoicing Now", "Single-click or scheduled cron batch runs.", "#0ea5e9");
          drawCallout(1460, 320, "Deterministic Checks", "Zero risk of double charging across cycles.", "#10b981");
          drawCallout(1460, 460, "7-Day Dunning Lifecycle", "Automatic retries on day 1, day 3, and day 7.", "#f59e0b");

          // Cursor clicks "Run Invoicing Now"
          const clicking = p > 0.4 && p < 0.7;
          drawCursor(880, 280, clicking);

          drawNarration(this.voice, p);
        }
      },
      {
        id: 5,
        title: "Invoices Management & State Machine",
        duration: 4.5,
        voice: "Invoices progress cleanly through a formal state machine: Draft, Posted, Paid, Overdue, or Cancelled.",
        draw(t, p) {
          drawHeader(5, "Invoices Table & State Machine Verification");

          drawScreenFrame(images.invoices, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.03, 30, p * 60);

          drawCallout(1460, 180, "Formal State Machine", "Draft ➔ Posted ➔ Paid / Overdue ➔ Cancelled.", "#0ea5e9");
          drawCallout(1460, 320, "Single-Click Actions", "Print / PDF, Share, and Record Payment.", "#10b981");
          drawCallout(1460, 460, "Integer Paise Math", "All amounts stored as paise to eliminate rounding errors.", "#14b8a6");

          drawCursor(650, 450 + p * 80);
          drawNarration(this.voice, p);
        }
      },
      {
        id: 6,
        title: "Tax Invoicing: Print PDF & Direct Share",
        duration: 4.5,
        voice: "Every invoice meets legal GST standards. You can print compliant A4 PDFs or share directly via WhatsApp and email.",
        draw(t, p) {
          drawHeader(6, "GST Tax Invoice (Print & Multi-Channel Sharing)");

          // Show the actual Share Dialog or Public Tax Invoice screenshot
          drawScreenFrame(images.share, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.08, 120, 90);

          drawCallout(1460, 160, "GST-Compliant A4 Print", "Formal tax invoice with CIN, GSTIN & HSN codes.", "#0ea5e9");
          drawCallout(1460, 300, "WhatsApp Direct Share", "Pre-filled message with invoice summary & UPI.", "#10b981");
          drawCallout(1460, 440, "Email Dispatch", "Direct email dispatch with payment instructions.", "#8b5cf6");
          drawCallout(1460, 580, "Public Permalinks", "Shareable links: /invoice/public/INV-2026-001.", "#14b8a6");

          drawCursor(780, 520, p > 0.5);
          drawNarration(this.voice, p);
        }
      },
      {
        id: 7,
        title: "Subscriptions & Subscriber Onboarding",
        duration: 4.5,
        voice: "Subscriptions support multi-tier plans, add-ons, flexible billing terms, and immediate lifecycle management.",
        draw(t, p) {
          drawHeader(7, "Subscription Management & Plan Configuration");

          drawScreenFrame(images.subs, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.05, 40, p * 30);

          drawCallout(1460, 180, "Onboarding Wizard", "Step-by-step subscription creation workflow.", "#0ea5e9");
          drawCallout(1460, 320, "Catalog Integration", "Links products, variants, and recurring rates.", "#10b981");
          drawCallout(1460, 460, "Upgrade & Downgrade", "Instant tier transitions with pro-rata logic.", "#14b8a6");

          drawCursor(500 + p * 150, 400);
          drawNarration(this.voice, p);
        }
      },
      {
        id: 8,
        title: "Staff Operations & Customer Administration",
        duration: 4.5,
        voice: "Staff members manage day-to-day operations under staff@brightloop.io with protected administration.",
        draw(t, p) {
          drawHeader(8, "Staff Operations & Customer Management");

          drawScreenFrame(images.staff, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.04, 30, 40);

          drawCallout(1460, 180, "Customer Directory", "Full customer records, GSTIN, and contact details.", "#0ea5e9");
          drawCallout(1460, 320, "Role Isolation", "Staff can assist customers without accessing credentials.", "#10b981");
          drawCallout(1460, 460, "Audit Trail", "Every operator action logged to audit trail table.", "#f59e0b");

          drawCursor(600, 350 + p * 60);
          drawNarration(this.voice, p);
        }
      },
      {
        id: 9,
        title: "Customer Self-Service Portal Experience",
        duration: 4.5,
        voice: "Subscribers access their self-service portal to review subscriptions, view upcoming renewals, and download invoices.",
        draw(t, p) {
          drawHeader(9, "Customer Self-Service Portal Experience");

          drawScreenFrame(images.portal, null, { x: 80, y: 120, w: 1350, h: 810 }, 1.05, 50, 50);

          drawCallout(1460, 160, "White-Labeled Portal", "Clean portal dedicated to subscribers.", "#0ea5e9");
          drawCallout(1460, 300, "Active Plan Overview", "Next invoice date, renewal rate & plan features.", "#10b981");
          drawCallout(1460, 440, "Invoice History", "One-click download of past statements & receipts.", "#14b8a6");
          drawCallout(1460, 580, "100% Tested & Verified", "28 / 28 test cases passed, ready for production.", "#8b5cf6");

          drawCursor(900, 450);
          drawNarration(this.voice, p);
        }
      }
    ];

    // VIDEO RECORDER ENGINE
    async function startRecording() {
      statusEl.innerText = "LOADING SCREENSHOTS...";
      await preloadImages();

      statusEl.innerText = "RECORDING REAL SCREEN WALKTHROUGH (1080P)...";
      progressEl.innerText = "Synthesizing audio and rendering actual application recordings...";

      const canvasStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
            ? 'video/webm;codecs=vp8,opus'
            : 'video/webm');

      const recorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 6000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        statusEl.innerText = "SAVING REAL SCREEN VIDEO...";
        progressEl.innerText = "Writing brightloop_presentation.webm to disk...";

        const blob = new Blob(chunks, { type: 'video/webm' });
        console.log(`[Recorder] Final video size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);

        try {
          const resp = await fetch("/api/save-video", {
            method: "POST",
            headers: { "Content-Type": "video/webm" },
            body: blob
          });
          const res = await resp.json();
          statusEl.innerText = "✓ REAL SCREEN WALKTHROUGH VIDEO READY!";
          progressEl.innerHTML = `Saved to: <b style="color:#0ea5e9">${res.url}</b> (${(blob.size / 1024 / 1024).toFixed(2)} MB).`;
          window._videoRecordingResult = { success: true, url: res.url, size: blob.size };
        } catch (err) {
          statusEl.innerText = "Error saving video";
          progressEl.innerText = err.message;
          window._videoRecordingResult = { error: err.message };
        }
      };

      recorder.start(500);

      const totalScenes = SCENES.length;
      for (let sIdx = 0; sIdx < totalScenes; sIdx++) {
        const scene = SCENES[sIdx];
        statusEl.innerText = `RECORDING CHAPTER ${sIdx + 1} / ${totalScenes}: ${scene.title.toUpperCase()}`;
        playChord(340 + sIdx * 35);

        const sceneFrames = Math.floor(scene.duration * 30);
        for (let f = 0; f < sceneFrames; f++) {
          const progress = f / sceneFrames;
          const time = f / 30;

          ctx.fillStyle = "#070b14";
          ctx.fillRect(0, 0, 1920, 1080);

          if (f === 15 || f === 45) playClick();

          scene.draw(time, progress);

          await new Promise(r => setTimeout(r, 1000 / 30));
        }
      }

      playSuccessChime();
      await new Promise(r => setTimeout(r, 600));
      recorder.stop();
    }

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => startRecording(), 800);
    });
  </script>
</body>
</html>

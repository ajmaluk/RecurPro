      min-height: 100vh;
      overflow: hidden;
    }
    #status {

      font-weight: 600;
      margin-bottom: 12px;
      color: #0ea5e9;
      letter-spacing: 0.05em;
    }
    #progress {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    canvas {
      width: 960px;
      height: 540px;
      border: 1px solid #1f293d;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background: #090d16;
    }
  </style>
</head>
<body>
  <div id="status">INITIALIZING RECORDER...</div>
  <div id="progress">Preparing scenes and audio stream...</div>
  <canvas id="recCanvas" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById("recCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");

    // Audio Context Setup
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const audioDest = audioCtx.createMediaStreamDestination();

    // Sound generation helpers
    function playTone(freq, duration, type = "sine", gainVal = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioDest);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playChord(baseFreq) {
      playTone(baseFreq, 1.2, "sine", 0.08);
      playTone(baseFreq * 1.25, 1.2, "sine", 0.06);
      playTone(baseFreq * 1.5, 1.2, "sine", 0.06);
    }

    function playTypeSound() {
      playTone(400 + Math.random() * 300, 0.04, "triangle", 0.03);
    }

    function playSuccessChime() {
      playTone(523.25, 0.3, "sine", 0.1); // C5
      setTimeout(() => playTone(659.25, 0.3, "sine", 0.1), 100); // E5
      setTimeout(() => playTone(783.99, 0.5, "sine", 0.12), 200); // G5
      setTimeout(() => playTone(1046.50, 0.8, "sine", 0.15), 300); // C6
    }

    // Colors
    const C = {
      bg: "#070b14",
      card: "#0f172a",
      cardBorder: "#1e293b",
      cardBorderGlow: "#0ea5e9",
      brand: "#0ea5e9",
      brandDark: "#0369a1",
      teal: "#14b8a6",
      green: "#10b981",
      amber: "#f59e0b",
      purple: "#8b5cf6",
      text: "#f8fafc",
      textMuted: "#94a3b8",
      textDim: "#64748b"
    };

    // Helper: Rounded Rectangle
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // Helper: Top Header
    function drawHeader(chapterNum, title) {
      // Glow background bar
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, 0, 1920, 90);
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 90);
      ctx.lineTo(1920, 90);
      ctx.stroke();

      // Logo Icon & Title
      ctx.fillStyle = C.teal;
      ctx.beginPath();
      ctx.arc(60, 45, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = C.brand;
      ctx.beginPath();
      ctx.arc(60, 45, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#070b14";
      ctx.fill();

      ctx.fillStyle = C.text;
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Brightloop", 90, 53);

      // Chapter Badge
      roundRect(ctx, 235, 28, 140, 34, 6, "rgba(14, 165, 233, 0.15)", C.brand);
      ctx.fillStyle = C.brand;
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(`CHAPTER 0${chapterNum} / 09`, 248, 50);

      // Active Title
      ctx.fillStyle = C.textMuted;
      ctx.font = "500 20px sans-serif";
      ctx.fillText(`—  ${title}`, 395, 52);

      // Status indicator
      roundRect(ctx, 1690, 28, 170, 34, 17, "rgba(16, 185, 129, 0.12)", C.green);
      ctx.fillStyle = C.green;
      ctx.beginPath();
      ctx.arc(1712, 45, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "bold 13px sans-serif";
      ctx.fillText("LIVE SYSTEM 2026", 1728, 50);
    }

    // Helper: Bottom Narration Bar
    function drawNarration(scriptText, progressPct) {
      // Bottom panel
      roundRect(ctx, 80, 950, 1760, 85, 12, "rgba(15, 23, 42, 0.95)", "#1e293b");

      // Progress bar within narration
      ctx.fillStyle = "rgba(30, 41, 59, 0.8)";
      ctx.fillRect(80, 1030, 1760, 5);
      ctx.fillStyle = C.brand;
      ctx.fillRect(80, 1030, 1760 * progressPct, 5);

      // Voiceover tag
      roundRect(ctx, 105, 968, 130, 26, 6, "rgba(14, 165, 233, 0.2)", C.brand);
      ctx.fillStyle = C.brand;
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("🎙 VOICEOVER", 120, 985);

      // Script Text
      ctx.fillStyle = "#ffffff";
      ctx.font = "500 20px sans-serif";
      ctx.fillText(scriptText, 255, 987);
    }

          const startX = 200;

          pillars.forEach((pil, idx) => {

            ctx.fillStyle = "rgba(14, 165, 233, 0.15)";

          ctx.fillStyle = C.textMuted;

          ctx.fillStyle = C.textMuted;
          ctx.font = "14px sans-serif";
          ctx.fillText("Customer Email", rightX + 50, cardY + 205);
          ctx.fillStyle = C.text;
          ctx.font = "bold 18px monospace";
          ctx.fillText("arjun@apexlogistics.in", rightX + 50, cardY + 228);

          roundRect(ctx, rightX + 30, cardY + 260, cardW - 60, 60, 8, "#090d16", "#334155");
          ctx.fillStyle = C.textMuted;
          ctx.font = "14px sans-serif";
          ctx.fillText("Password", rightX + 50, cardY + 285);
          ctx.fillStyle = C.text;
          ctx.font = "bold 22px sans-serif";
          ctx.fillText("••••••••••••", rightX + 50, cardY + 308);

          roundRect(ctx, rightX + 30, cardY + 345, cardW - 60, 56, 8, C.teal, null);
          ctx.fillStyle = "#070b14";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Enter Customer Portal →", rightX + cardW / 2, cardY + 380);

          ctx.textAlign = "left";
          ctx.fillStyle = C.textMuted;
          ctx.font = "13px sans-serif";
          ctx.fillText("Sample Subscribers:", rightX + 30, cardY + 440);
          roundRect(ctx, rightX + 30, cardY + 460, 275, 40, 6, "rgba(30, 41, 59, 0.7)", "#334155");
          ctx.fillStyle = C.text;
          ctx.font = "13px monospace";
          ctx.fillText("arjun@apexlogistics.in", rightX + 45, cardY + 485);

          roundRect(ctx, rightX + 325, cardY + 460, 275, 40, 6, "rgba(30, 41, 59, 0.7)", "#334155");
          ctx.fillText("neha@zenithtech.in", rightX + 340, cardY + 485);

          drawNarration(this.voice, p);
        }
      },
      {
        id: 3,
        title: "Executive Financial Dashboard",
        duration: 4.5,
        voice: "Upon login, the executive dashboard delivers real-time visibility into MRR, active subscribers, and cash flow.",
        draw(t, p) {
          drawHeader(3, "Back Office Financial Operations Dashboard");

          // 4 Metric KPI Cards
          const kpis = [
            { label: "MONTHLY RECURRING REVENUE", val: "₹18,45,000", change: "+14.8% MoM", color: C.brand },
            { label: "ACTIVE SUBSCRIBERS", val: "312", change: "+24 this month", color: C.teal },
            { label: "TOTAL INVOICED REVENUE", val: "₹42,80,000", change: "98.4% Paid rate", color: C.green },
            { label: "DUE & RETRYING INVOICES", val: "₹1,24,000", change: "4 in Dunning", color: C.amber }
          ];

          const startX = 120;
          const kpiW = 390;
          const gap = 30;
          kpis.forEach((k, idx) => {
            const bx = startX + idx * (kpiW + gap);
            roundRect(ctx, bx, 140, kpiW, 140, 12, C.card, C.cardBorder);

            ctx.fillStyle = C.textMuted;
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(k.label, bx + 24, 175);

            ctx.fillStyle = C.text;
            ctx.font = "bold 34px sans-serif";
            ctx.fillText(k.val, bx + 24, 225);

            roundRect(ctx, bx + 250, 200, 115, 26, 13, "rgba(16, 185, 129, 0.15)", k.color);
            ctx.fillStyle = k.color;
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(k.change, bx + 307, 217);
          });

          // Main Chart Card (Left)
          const chartW = 1040;
          const chartH = 480;
          roundRect(ctx, 120, 310, chartW, chartH, 12, C.card, C.cardBorder);

          ctx.fillStyle = C.text;
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("Revenue & Invoicing Trajectory (2026)", 150, 355);

          ctx.fillStyle = C.textMuted;
          ctx.font = "14px sans-serif";
          ctx.fillText("Calculated with integer-paise financial precision.", 150, 385);

          // Draw animated area chart
          const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"];
          const values = [12, 14.5, 13.8, 16.2, 18.0, 21.5, 23.0, 26.4, 31.0, 38.5];
          const chartOriginX = 180;
          const chartOriginY = 720;
          const chartPlotW = 920;
          const chartPlotH = 270;

          // Grid lines
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 1;
          for (let i = 0; i <= 4; i++) {
            const gy = chartOriginY - (chartPlotH / 4) * i;
            ctx.beginPath();
            ctx.moveTo(chartOriginX, gy);
            ctx.lineTo(chartOriginX + chartPlotW, gy);
            ctx.stroke();

            ctx.fillStyle = C.textDim;
            ctx.font = "12px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(`₹${i * 10}L`, chartOriginX - 15, gy + 4);
          }

          // Animated curve
          ctx.beginPath();
          const stepX = chartPlotW / (months.length - 1);
          const maxVal = 40;
          const currentPts = [];
          for (let i = 0; i < months.length; i++) {
            const px = chartOriginX + i * stepX;
            const progressHeight = Math.min(1, p * 1.5);
            const py = chartOriginY - (values[i] / maxVal) * chartPlotH * progressHeight;
            currentPts.push({ x: px, y: py });
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.strokeStyle = C.brand;
          ctx.lineWidth = 3.5;
          ctx.stroke();

          // Fill gradient under curve
          ctx.lineTo(chartOriginX + chartPlotW, chartOriginY);
          ctx.lineTo(chartOriginX, chartOriginY);
          ctx.closePath();
          const chartGrad = ctx.createLinearGradient(0, chartOriginY - chartPlotH, 0, chartOriginY);
          chartGrad.addColorStop(0, "rgba(14, 165, 233, 0.3)");
          chartGrad.addColorStop(1, "rgba(14, 165, 233, 0.0)");
          ctx.fillStyle = chartGrad;
          ctx.fill();

          // Month labels
          months.forEach((m, i) => {
            ctx.fillStyle = C.textMuted;
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(m, chartOriginX + i * stepX, chartOriginY + 25);
          });

          // Recent Invoices Table (Right)

          const tableW = 610;
          roundRect(ctx, tableX, 310, tableW, chartH, 12, C.card, C.cardBorder);

          ctx.fillStyle = C.text;
          ctx.font = "bold 20px sans-serif";

            { id: "INV-2026-003", cust: "BluePeak Solutions", amount: "₹14,750", status: "PAID", stCol: C.green },
            { id: "INV-2026-004", cust: "Quantix Retailers", amount: "₹11,800", status: "DRAFT", stCol: C.amber },
            { id: "INV-2026-005", cust: "HyperNova Labs", amount: "₹47,200", status: "PAID", stCol: C.green }
          ];

          sampleInvoices.forEach((inv, i) => {
            const ry = 400 + i * 65;
            ctx.fillStyle = i % 2 === 0 ? "rgba(30, 41, 59, 0.3)" : "transparent";
            ctx.fillRect(tableX + 15, ry - 15, tableW - 30, 55);

            ctx.fillStyle = C.text;
            ctx.font = "bold 15px monospace";
            ctx.textAlign = "left";
            ctx.fillText(inv.id, tableX + 30, ry + 18);

            ctx.fillStyle = C.textMuted;
            ctx.font = "14px sans-serif";
            ctx.fillText(inv.cust, tableX + 180, ry + 18);

            ctx.fillStyle = C.text;
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(inv.amount, tableX + 460, ry + 18);

            ctx.fillStyle = inv.stCol;
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(inv.status, tableX + 522, ry + 18);
          });

          drawNarration(this.voice, p);
        }

      {

            const ty = 290 + i * 58;
            roundRect(ctx, rightX + 40, ty, rightW - 80, 48, 8, "#090d16", "#334155");

            roundRect(ctx, rightX + 55, ty + 12, 24, 24, 12, "rgba(16, 185, 129, 0.2)", C.green);
            ctx.fillStyle = C.green;
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("✓", rightX + 67, ty + 29);

            ctx.textAlign = "left";
            ctx.fillStyle = C.text;
            ctx.font = "14px sans-serif";
            ctx.fillText(tName, rightX + 95, ty + 30);
          });

          // Summary Banner
          roundRect(ctx, rightX + 40, 770, rightW - 80, 65, 8, "rgba(16, 185, 129, 0.15)", C.green);
          ctx.fillStyle = C.green;
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("28 / 28 TEST SUITE PASSED  •  100% PRODUCTION READY", rightX + rightW / 2, 810);

          drawNarration(this.voice, p);
        }
      }
    ];

    // VIDEO RECORDER RUNNER
    async function startRecording() {
      statusEl.innerText = "RECORDING FULL 1080P VIDEO...";
      progressEl.innerText = "Capturing canvas frames and synthesizing synchronized audio...";

      // Setup Canvas Stream at 30 fps
      const canvasStream = canvas.captureStream(30);

      // Combine Canvas Video Track + Web Audio Track
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
            ? 'video/webm;codecs=vp8,opus'
            : 'video/webm');

      const recorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 6000000 // 6 Mbps high quality
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        statusEl.innerText = "PROCESSING & SAVING VIDEO...";
        progressEl.innerText = "Uploading generated video to /api/save-video...";

        const blob = new Blob(chunks, { type: 'video/webm' });
        console.log(`[Recorder] Recorded video blob size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);

        try {
          const resp = await fetch("/api/save-video", {
            method: "POST",
            headers: { "Content-Type": "video/webm" },
            body: blob
          });
          const res = await resp.json();
          statusEl.innerText = "✓ VIDEO CREATED & SAVED SUCCESSFULLY!";
          progressEl.innerHTML = `Video saved to: <b style="color:#0ea5e9">${res.url}</b> (${(blob.size / 1024 / 1024).toFixed(2)} MB).`;
          window._videoRecordingResult = { success: true, url: res.url, size: blob.size };
        } catch (err) {
          statusEl.innerText = "Error saving video";
          progressEl.innerText = err.message;
          window._videoRecordingResult = { error: err.message };
        }
      };

      recorder.start(500); // 500ms chunk timeslice

      // Animate through all scenes
      const totalScenes = SCENES.length;
      let currentSceneIdx = 0;

      for (let sIdx = 0; sIdx < totalScenes; sIdx++) {
        const scene = SCENES[sIdx];
        currentSceneIdx = sIdx + 1;
        statusEl.innerText = `RECORDING CHAPTER ${currentSceneIdx} / ${totalScenes}: ${scene.title.toUpperCase()}`;

        // Play chapter chime
        playChord(350 + sIdx * 40);

        const sceneFrames = Math.floor(scene.duration * 30);
        for (let f = 0; f < sceneFrames; f++) {
          const progress = f / sceneFrames;
          const time = f / 30;

          // Clear
          ctx.fillStyle = C.bg;
          ctx.fillRect(0, 0, 1920, 1080);

          // Typewriter audio clicks on scene 2
          if (sIdx === 1 && f % 8 === 0) playTypeSound();

          // Render Scene
          scene.draw(time, progress);

          // Advance one frame
          await new Promise(r => setTimeout(r, 1000 / 30));
        }
      }

      // Final celebratory chime
      playSuccessChime();
      await new Promise(r => setTimeout(r, 600));

      recorder.stop();
    }

    // Auto-start on load
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => startRecording(), 1000);
    });
  </script>
